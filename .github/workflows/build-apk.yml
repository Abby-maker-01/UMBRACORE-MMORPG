name: Build ECLIPSE Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        run: npm install
      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          pattern=r'(<activity\\b[^>]*android:name="[^"]*MainActivity"[^>]*)(>)'
          s=re.sub(pattern, lambda m: m.group(1) if 'android:screenOrientation' in m.group(1) else m.group(1)+' android:screenOrientation="landscape"'+m.group(2), s, count=1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE-ISOMETRIC-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
